<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>otc.fam</title>
  <style>
    :root { color-scheme: light dark; --fg: #111; --bg: #fff; --muted: #666; --line: #ddd; --accent: #1a56db; --ok: #157347; --bad: #b02a37; }
    @media (prefers-color-scheme: dark) { :root { --fg: #eee; --bg: #121212; --muted: #999; --line: #333; --accent: #6ea0ff; --ok: #5cc98a; --bad: #ff7b86; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
    header a { color: inherit; text-decoration: none; font-weight: 700; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin: 12px 0; }
    .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; padding-top: 0; }
    .label { color: var(--muted); flex: none; }
    .value { text-align: right; overflow-wrap: anywhere; }
    .big { font-size: 24px; font-weight: 700; }
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 14px; }
    .pill[data-status="open"] { border-color: var(--ok); color: var(--ok); }
    .pill[data-status="filled"] { border-color: var(--accent); color: var(--accent); }
    .pill[data-status="cancelled"], .pill[data-status="expired"], .pill[data-status="not-found"] { border-color: var(--bad); color: var(--bad); }
    .notice { padding: 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); overflow-wrap: anywhere; }
    .muted { color: var(--muted); font-size: 14px; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button:disabled { opacity: .5; cursor: default; }
    label { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
    input { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
    code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <header><a href="#/">otc.fam</a><a href="#/new" class="muted">New deal</a></header>
    <div id="view"><p class="muted">Loading…</p></div>
  </main>
  <script>
    // --- the chain: JSON-RPC reads at config.rpcUrl, transactions through window.ethereum (EIP-1193) ---
    const SEL = { // function selectors, keccak256(signature)[:4]
      getDeal: "0x82fd5bac", fill: "0x3fda5389", createDeal: "0x706f50dc", symbol: "0x95d89b41", decimals: "0x313ce567",
      allowance: "0xdd62ed3e", approve: "0x095ea7b3", balanceOf: "0x70a08231",
    };
    const DEAL_CREATED = "0x1c07d8ea6e5c6ec1eccadc84e71fb9989193eb338ddddea20f1445943761ff9c"; // keccak256("DealCreated(uint256,address,address)")
    const ZERO = "0x0000000000000000000000000000000000000000";
    const STATUS = ["not-found", "open", "filled", "cancelled"];
    const isAddress = (s) => /^0x[0-9a-fA-F]{40}$/.test(s);
    const word = (v) => BigInt(v).toString(16).padStart(64, "0");
    const words = (hex) => hex.slice(2).match(/.{64}/g) ?? [];
    const toAddress = (w) => "0x" + w.slice(24);
    const toUint = (w) => BigInt("0x" + w);
    const text = (s) => { const t = document.createElement("span"); t.textContent = s; return t.innerHTML; };

    let config, chainNow = 0;
    async function rpc(method, params = []) {
      const res = await fetch(config.rpcUrl, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }) });
      const { result, error } = await res.json();
      if (error) throw new Error(error.message);
      return result;
    }
    const call = (to, data) => rpc("eth_call", [{ to, data }, "latest"]);
    async function token(address) {
      const [sym, dec] = await Promise.all([call(address, SEL.symbol), call(address, SEL.decimals)]);
      const symbol = sym.length === 66 ? bytes(sym).replace(/\0+$/, "") : bytes(sym.slice(2 + 128)); // bytes32 (MKR) or string
      return { address, symbol: new TextDecoder().decode(symbol).trim() || "???", decimals: Number(toUint(words(dec)[0])) };
    }
    const bytes = (hex) => Uint8Array.from((hex.replace(/^0x/, "").match(/.{2}/g) ?? []).map((b) => parseInt(b, 16)));
    function format(amount, decimals) { // exact, never rounded: 1500250000 with 6 decimals → "1500.25"
      const s = amount.toString().padStart(decimals + 1, "0");
      const frac = decimals ? s.slice(-decimals).replace(/0+$/, "") : "";
      return s.slice(0, s.length - decimals) + (frac ? "." + frac : "");
    }
    function parse(amount, decimals) { // "250.5" with 6 decimals → 250500000n; null when it is not a plain positive number
      const m = /^(\d+)(?:\.(\d*))?$/.exec(amount.trim());
      if (!m || (m[2] ?? "").length > decimals) return null;
      return BigInt(m[1] + (m[2] ?? "").padEnd(decimals, "0"));
    }

    // --- the wallet ---
    const eth = window.ethereum;
    let account = null, chainId = null;
    async function connect() {
      [account] = await eth.request({ method: "eth_requestAccounts" });
      account = account.toLowerCase();
      chainId = Number(await eth.request({ method: "eth_chainId" }));
      if (chainId !== config.chainId) {
        await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x" + config.chainId.toString(16) }] });
        chainId = Number(await eth.request({ method: "eth_chainId" }));
      }
    }
    const onRightChain = () => chainId === config.chainId;
    async function send(to, data) {
      const hash = await eth.request({ method: "eth_sendTransaction", params: [{ from: account, to, data }] });
      for (;;) {
        const receipt = await eth.request({ method: "eth_getTransactionReceipt", params: [hash] });
        if (receipt) {
          if (receipt.status !== "0x1") throw new Error("The transaction failed on the chain. Nothing moved.");
          return receipt;
        }
        await new Promise((r) => setTimeout(r, 500));
      }
    }
    const approve = (tok, amount) => send(tok, SEL.approve + word(config.contract) + word(amount));
    const allowance = async (tok) => toUint(words(await call(tok, SEL.allowance + word(account) + word(config.contract)))[0]);
    const balance = async (tok) => toUint(words(await call(tok, SEL.balanceOf + word(account)))[0]);
    eth?.on?.("accountsChanged", (accounts) => { account = accounts[0]?.toLowerCase() ?? null; route(); });
    eth?.on?.("chainChanged", () => route());

    // --- the views ---
    const view = document.getElementById("view");
    let notice = "", busy = false;
    const noticeHtml = () => (notice ? `<p class="notice" data-testid="notice">${text(notice)}</p>` : "");
    /** Wires primary-action: disabled the instant it is pressed, back after `step` ran and the view was drawn again. */
    function onPress(step) {
      const button = view.querySelector("[data-testid=primary-action]");
      if (!button) return;
      button.onclick = async () => {
        button.disabled = true;
        busy = true;
        notice = "";
        try {
          await step();
        } catch (e) {
          notice = e.message?.replace(/^.*?:\s*(?=[A-Z])/, "") || "Something went wrong.";
        }
        busy = false;
        route();
      };
    }
    const when = (unix) => new Date(unix * 1000).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    function left(unix) {
      const s = unix - Math.floor(Date.now() / 1000);
      if (s <= 0) return "already passed";
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), d = Math.floor(h / 24);
      return "in " + (d >= 2 ? `${d} days` : h >= 1 ? `${h} h ${m} min` : m >= 1 ? `${m} min` : `${s} s`);
    }

    async function showDeal(id) {
      const w = words(await call(config.contract, SEL.getDeal + word(id)));
      const deal = { maker: toAddress(w[0]), taker: toAddress(w[1]), sellToken: toAddress(w[2]), sellAmount: toUint(w[3]), buyToken: toAddress(w[4]), buyAmount: toUint(w[5]), expiry: Number(toUint(w[6])), status: Number(toUint(w[7])) };
      if (deal.status === 0) {
        view.innerHTML = `<h1>Deal #${id}</h1><p class="card"><span class="pill" data-testid="deal-status" data-status="not-found">Not found</span><br><br>No deal has this number on this contract. Check the link you were sent.</p>`;
        return;
      }
      chainNow = Number((await rpc("eth_getBlockByNumber", ["latest", false])).timestamp);
      const [sell, buy] = await Promise.all([token(deal.sellToken), token(deal.buyToken)]);
      const pay = format(deal.buyAmount, buy.decimals), get = format(deal.sellAmount, sell.decimals);
      const expired = deal.status === 1 && deal.expiry <= Math.max(chainNow, Math.floor(Date.now() / 1000));
      const status = expired ? "expired" : STATUS[deal.status];
      const said = { open: "Open: waiting for the other side", filled: "Filled: both sides have been paid", cancelled: "Cancelled by the maker: nothing to fill", expired: "Expired: it can no longer be filled" }[status];
      const reserved = deal.taker !== ZERO;

      // What there is to press, and what to say.
      let button = "", note = notice, step = null;
      if (status === "open") {
        if (!eth) note ||= "To fill this deal, open this link in a browser with a wallet (MetaMask, Rabby, Coinbase Wallet…).";
        else if (!account) { button = "Connect wallet"; step = connect; }
        else if (!onRightChain()) { note = `Your wallet is on chain ${chainId}; this deal lives on chain ${config.chainId}.`; button = "Switch network"; step = connect; }
        else if (reserved && deal.taker.toLowerCase() !== account) note = `This deal is reserved for ${deal.taker}. Your wallet is ${account}. Connect that address to fill it.`;
        else {
          const [have, allowed] = await Promise.all([balance(buy.address), allowance(buy.address)]);
          if (have < deal.buyAmount) note = `You hold ${format(have, buy.decimals)} ${buy.symbol}; this deal needs ${pay} ${buy.symbol}.`;
          else if (allowed < deal.buyAmount) { button = `Approve ${pay} ${buy.symbol}`; note ||= `Step 1 of 2: let the deal contract take ${pay} ${buy.symbol} from your wallet. Step 2 fills the deal.`; step = () => approve(buy.address, deal.buyAmount); }
          else { button = `Pay ${pay} ${buy.symbol}, receive ${get} ${sell.symbol}`; note ||= "Last step: one transaction swaps both amounts. Nothing moves unless both sides are paid."; step = () => send(config.contract, SEL.fill + word(id)); }
        }
      } else if (status === "filled" && account && !notice) note = "Done. The tokens are in the wallets of both sides.";
      notice = note;

      view.innerHTML = `
        <h1>Deal #${id}</h1>
        <p><span class="pill" data-testid="deal-status" data-status="${status}">${said}</span></p>
        <div class="card">
          <div class="row"><span class="label">You pay</span><span class="value big"><span data-testid="pay-amount">${pay}</span> <span data-testid="pay-symbol">${text(buy.symbol)}</span></span></div>
          <div class="row"><span class="label">You receive</span><span class="value big"><span data-testid="receive-amount">${get}</span> <span data-testid="receive-symbol">${text(sell.symbol)}</span></span></div>
          <div class="row"><span class="label">From</span><code class="value" data-testid="maker">${deal.maker}</code></div>
          <div class="row"><span class="label">${reserved ? "Only for" : "Open to"}</span><code class="value">${reserved ? deal.taker : "anyone with this link"}</code></div>
          <div class="row"><span class="label">${status === "expired" ? "Expired" : "Expires"}</span><span class="value" data-testid="expires" data-expiry="${deal.expiry}">${when(deal.expiry)}<br><span class="muted">${left(deal.expiry)}</span></span></div>
        </div>
        ${noticeHtml()}
        ${button ? `<button data-testid="primary-action" ${busy ? "disabled" : ""}>${text(button)}</button>` : ""}
        <p class="muted">Tokens: ${text(sell.symbol)} <code>${sell.address}</code> · ${text(buy.symbol)} <code>${buy.address}</code></p>`;
      onPress(step);
      if (status === "open") setTimeout(() => location.hash === `#/d/${id}` && deal.expiry <= Date.now() / 1000 && !busy && route(), Math.max(1000, (deal.expiry - Date.now() / 1000) * 1000 + 1000));
    }

    const fields = [["sell-token", "Token you give (address)"], ["sell-amount", "Amount you give"], ["buy-token", "Token you want (address)"], ["buy-amount", "Amount you want"], ["taker", "Only for (address, or empty for anyone)"], ["expiry-hours", "Expires in (hours)"]];
    const form = {};
    async function showNew() {
      const link = form.link;
      view.innerHTML = `
        <h1>New deal</h1>
        <p class="muted">You give one token, you get another. Your tokens stay in the contract until the other side pays or you cancel.</p>
        <div class="card">
          ${fields.map(([id, label]) => `<label for="${id}">${label}</label><input id="${id}" data-testid="${id}" value="${text(form[id] ?? "")}" ${link ? "disabled" : ""} autocomplete="off" spellcheck="false">`).join("")}
        </div>
        ${noticeHtml()}
        ${link ? `<p class="card">Deal created. Send this link to the other side:<br><a data-testid="deal-link" href="${link}">${link}</a></p>`
          : `<button data-testid="primary-action" ${busy ? "disabled" : ""}>${!eth ? "Open in a wallet browser to create a deal" : !account ? "Connect wallet" : !onRightChain() ? "Switch network" : "Create deal"}</button>`}`;
      for (const [id] of fields) view.querySelector(`#${id}`).oninput = (e) => { form[id] = e.target.value; };
      if (!eth) view.querySelector("button").disabled = true;
      onPress(async () => {
        if (!account || !onRightChain()) return connect();
        const terms = await readForm();
        const allowed = await allowance(terms.sell.address);
        if (allowed < terms.sellAmount) {
          await approve(terms.sell.address, terms.sellAmount);
          notice = `Approved ${format(terms.sellAmount, terms.sell.decimals)} ${terms.sell.symbol}. Press again to create the deal.`;
          return;
        }
        const data = SEL.createDeal + word(terms.sell.address) + word(terms.sellAmount) + word(terms.buy.address) + word(terms.buyAmount) + word(terms.taker) + word(terms.expiry);
        const receipt = await send(config.contract, data);
        const log = receipt.logs.find((l) => l.address.toLowerCase() === config.contract.toLowerCase() && l.topics[0] === DEAL_CREATED);
        form.link = `${location.origin}${location.pathname}#/d/${toUint(log.topics[1].slice(2))}`;
        notice = `You give ${format(terms.sellAmount, terms.sell.decimals)} ${terms.sell.symbol} and get ${format(terms.buyAmount, terms.buy.decimals)} ${terms.buy.symbol}, until ${when(terms.expiry)}.`;
      });
    }
    async function readForm() {
      for (const id of ["sell-token", "buy-token"]) if (!isAddress(form[id] ?? "")) throw new Error(`"${form[id] ?? ""}" is not a token address (0x and 40 hex digits).`);
      if (form["sell-token"].toLowerCase() === form["buy-token"].toLowerCase()) throw new Error("The two tokens must differ.");
      const [sell, buy] = await Promise.all([token(form["sell-token"]), token(form["buy-token"])]).catch(() => { throw new Error("One of the addresses is not an ERC-20 token on this chain."); });
      const sellAmount = parse(form["sell-amount"] ?? "", sell.decimals), buyAmount = parse(form["buy-amount"] ?? "", buy.decimals);
      if (!sellAmount) throw new Error(`The amount you give must be a positive number with at most ${sell.decimals} decimals (${sell.symbol}).`);
      if (!buyAmount) throw new Error(`The amount you want must be a positive number with at most ${buy.decimals} decimals (${buy.symbol}).`);
      const taker = (form.taker ?? "").trim() || ZERO;
      if (!isAddress(taker)) throw new Error(`"${taker}" is not an address. Leave it empty to let anyone fill the deal.`);
      const hours = Number(form["expiry-hours"]);
      if (!(hours > 0)) throw new Error("Expires in: enter a number of hours greater than zero.");
      const have = await balance(sell.address);
      if (have < sellAmount) throw new Error(`You hold ${format(have, sell.decimals)} ${sell.symbol}; the deal needs ${format(sellAmount, sell.decimals)}.`);
      return { sell, buy, sellAmount, buyAmount, taker, expiry: Math.floor(Date.now() / 1000 + hours * 3600) };
    }

    async function route() {
      try {
        config ??= await (await fetch("config.json")).json();
        const deal = /^#\/d\/(\d+)$/.exec(location.hash);
        if (deal) await showDeal(BigInt(deal[1]));
        else if (location.hash === "#/new") await showNew();
        else view.innerHTML = `<h1>One deal, one link</h1><p>otc.fam swaps two tokens between two people, with no middleman. The maker creates a deal and sends its link; the other side opens it, sees what they pay and get, and fills it.</p><p><a href="#/new">Create a deal</a></p>`;
      } catch (e) {
        view.innerHTML = `<p class="notice" data-testid="notice">Could not load: ${text(e.message)}</p>`;
      }
    }
    addEventListener("hashchange", () => { notice = ""; delete form.link; route(); });
    route();
  </script>
</body>
</html>
